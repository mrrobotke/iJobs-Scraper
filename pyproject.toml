[project]
name = "ijobs-scraper"
version = "0.1.0"
description = "Job scraping & AI enrichment engine for African job markets"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "iWorldAfric"}]
readme = "README.md"
keywords = ["scraping", "jobs", "ai", "openai", "kenya", "africa", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "croniter>=2.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
careerjet = ["careerjet-api>=3.0"]
pdf = ["pdfplumber>=0.10"]
all = ["ijobs-scraper[browser,careerjet,pdf]"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.22",
    "mypy>=1.10",
    "ruff>=0.7",
]

[project.urls]
Homepage = "https://github.com/mrrobotke/ijobs-scraper"
Documentation = "https://github.com/mrrobotke/ijobs-scraper#readme"
Repository = "https://github.com/mrrobotke/ijobs-scraper"
"Bug Tracker" = "https://github.com/mrrobotke/ijobs-scraper/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ijobs_scraper"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: marks tests that hit real APIs (deselect with '-m \"not live\"')"]
testpaths = ["tests"]

[tool.coverage.run]
source_pkgs = ["ijobs_scraper"]

[tool.coverage.report]
show_missing = true
